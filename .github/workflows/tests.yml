name: tests

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: pip install PySide6 numpy
      - name: Unit tests and mutation controls
        run: python tests/mutate.py
