    var target = a.getAttribute("href").replace(/\.html$/, "");

  if (edit) edit.href = "https://github.com/Foadsf/Katydid/edit/main/docs/" + page + ".adoc";

    a.addEventListener("click", function () { document.getElementById("kd-menu-toggle").checked = false; });
